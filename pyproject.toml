[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-qa-harness"
version = "0.1.0"
description = "QA automation harness for smart-home environmental controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.coverage.run]
source = ["smart_home_qa_harness"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90