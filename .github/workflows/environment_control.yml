name: Scheduled Environment Control

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent two environment-control runs from executing simultaneously.
concurrency:
  group: environment-control
  cancel-in-progress: false

jobs:
  run-environment-control:
    name: Evaluate home environment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      WEATHER_LATITUDE: ${{ vars.WEATHER_LATITUDE }}
      WEATHER_LONGITUDE: ${{ vars.WEATHER_LONGITUDE }}

      SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
      SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
      SWITCHBOT_DEVICE_ID: ${{ secrets.SWITCHBOT_DEVICE_ID }}

      VOICE_MONKEY_API_TOKEN: ${{ secrets.VOICE_MONKEY_API_TOKEN }}
      VOICE_MONKEY_OPEN_DEVICE_ID: ${{ secrets.VOICE_MONKEY_OPEN_DEVICE_ID }}
      VOICE_MONKEY_CLOSE_DEVICE_ID: ${{ secrets.VOICE_MONKEY_CLOSE_DEVICE_ID }}
      NOTIFICATION_STATE_FILE: .state/notifications.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: python -m pip install .

      - name: Restore notification state
        id: notification-state
        uses: actions/cache/restore@v4
        with:
          path: .state/notifications.json
          key: notification-state-${{ github.run_id }}
          restore-keys: |
            notification-state-

      - name: Run scheduled environment control
        id: environment-control
        run: python scripts/run_scheduled_control.py

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/notifications.json
          key: notification-state-${{ github.run_id }}
